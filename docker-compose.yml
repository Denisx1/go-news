services:
  gonews:
    build: .
    dockerfile: cmd/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    shm_size: "1gb"
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
